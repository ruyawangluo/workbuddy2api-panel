services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 容器默认以 root(0) 运行：宿主机挂载目录（./auths ./data ./config.json）由
    # docker 自动创建时属主为 root，以 root 运行可直接写入，无需手动 chown。
    # 如需降权运行，可设置 PUID/PGID（例如 PUID=1000 PGID=1000），此时需确保
    # 挂载目录对该 uid 可写（chown -R 1000:1000 ./auths ./data ./config.json）。
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    # 接入 1Panel 默认桥接网络：可与 1Panel 应用商店/网站反向代理的容器按容器名互访。
    # 该网络需已存在（1Panel 安装后默认创建），否则 compose 会报 network not found。
    networks:
      - 1panel-network
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json

networks:
  1panel-network:
    external: true
